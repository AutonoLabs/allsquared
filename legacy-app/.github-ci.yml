name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Dummy values so drizzle.config.ts and build don't crash on CI.
      # Real secrets are only available in Vercel.
      DATABASE_URL: postgresql://test:test@localhost:5432/test
      CLERK_SECRET_KEY: sk_test_ci_dummy
      VITE_CLERK_PUBLISHABLE_KEY: pk_test_ci_dummy
      STRIPE_SECRET_KEY: sk_test_ci_dummy
      STRIPE_PUBLISHABLE_KEY: pk_test_ci_dummy
      STRIPE_WEBHOOK_SECRET: whsec_ci_dummy
      OPENAI_API_KEY: sk-ci-dummy
      JWT_SECRET: ci_dummy_jwt_secret_at_least_32_chars_long_xxxxx
      VITE_APP_TITLE: AllSquared
      VITE_APP_ID: ci
      VITE_APP_LOGO: /logo.png
      VITE_OAUTH_PORTAL_URL: https://example.com
      OAUTH_SERVER_URL: https://example.com
      OWNER_OPEN_ID: ci
      OWNER_NAME: CI
      BUILT_IN_FORGE_API_URL: https://example.com
      BUILT_IN_FORGE_API_KEY: ci_dummy

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm check

      - name: Test
        run: pnpm test -- --reporter=verbose
        continue-on-error: true   # tests are being added; don't block on coverage gaps

      - name: Build
        run: pnpm build

  codeql:
    name: CodeQL Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: typescript-javascript
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
